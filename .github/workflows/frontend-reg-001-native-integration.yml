# One bounded, non-production integration run. No cross-repo credentials or CI repo.
name: FRONTEND-REG-001 Native Laravel/React/Chromium Integration
on:
  push:
    branches:
      - forge/frontend-reg-001-native-integration-20261011
permissions:
  contents: read
concurrency:
  group: frontend-reg-001-native-validation
  cancel-in-progress: false
jobs:
  frontend-laravel-native:
    if: ${{ github.repository == 'Project-Intra-Smithy/Talibon-Sales-Prototype' && github.ref == 'refs/heads/forge/frontend-reg-001-native-integration-20261011' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      RTCI_BASE_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: rt_ci_disposable_127001_only
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      RTCI_BACKEND_DIR: ${{ github.workspace }}
      RTCI_WORKSPACE_DIR: ${{ github.workspace }}
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: talibon_portal_test
          POSTGRES_PASSWORD: rt_ci_disposable_127001_only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d talibon_portal_test"
          --health-interval 10s --health-timeout 5s --health-retries 6
    steps:
      - name: Checkout combined exact backend and pinned frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set disposable report path and temporary synthetic credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/forge/frontend-reg-001-native-integration-20261011
          echo "RTCI_REPORT_DIR=$RUNNER_TEMP/frontend-reg-001-report" >> "$GITHUB_ENV"
          PW="$(openssl rand -hex 32)"
          echo "::add-mask::$PW"
          echo "PROTOTYPE_DEMO_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "QA_DEMO_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Set up Node from canonical Laravel .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Set up PHP 8.4, Composer and PostgreSQL
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql, pgsql, fileinfo, zip
          coverage: none
      - name: Verify exact integrated source tree and 33 blob pins
        run: node tests/runtime-acceptance/native-source-attestation.mjs
      - name: Verify isolated empty PostgreSQL and exact database target
        run: node scripts/ci/frontend-reg-001/db-preflight.mjs "$GITHUB_WORKSPACE"
      - name: Real TypeScript, production build, Laravel HTTP/CSRF/MFA and Chromium
        run: bash scripts/ci/frontend-reg-001/run-native.sh
      - name: Upload only source proof, sanitized cases and guest login screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-reg-001-native-evidence
          path: |
            ${{ runner.temp }}/frontend-reg-001-report/source-attestation.json
            ${{ runner.temp }}/frontend-reg-001-report/browser-cases.json
            ${{ runner.temp }}/frontend-reg-001-report/guest-desktop.png
            ${{ runner.temp }}/frontend-reg-001-report/guest-mobile.png
          if-no-files-found: ignore
          retention-days: 1
