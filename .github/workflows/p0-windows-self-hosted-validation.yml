name: P08 Targeted Baseline Acceptance

on:
  push:
    branches:
      - KIRCH-TALIBON-P08-TARGETED-VALIDATION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p08-baseline-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Exact-head P08 acceptance on Windows runner
    runs-on: [self-hosted, Windows, X64, talibon-p0-temp]
    timeout-minutes: 60

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ secrets.P0_POSTGRES_PASSWORD }}
      PGPASSWORD: ${{ secrets.P0_POSTGRES_PASSWORD }}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      PROTOTYPE_DEMO_PASSWORD: P0-Disposable-Runner-Password-2026
      QA_DEMO_PASSWORD: P0-Disposable-Runner-Password-2026
      QA_BASE_URL: http://127.0.0.1:8000
      QA_MODE: production
      QA_ENVIRONMENT: p08-windows-self-hosted
      QA_EXPECTED_SHA: ${{ github.sha }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout exact P08 head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Git authority and P07 ancestry
        run: |
          $ErrorActionPreference = 'Stop'
          $authorizedMain = '269975e1c1e61bcde78490530e5cc8e90f35ae47'
          $p07 = '6b01368e7f03e6ba7dd7b93327623bc1f98d543f'
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          $mergeBase = (git merge-base HEAD origin/main).Trim()
          $relationship = (git rev-list --left-right --count origin/main...HEAD).Trim()

          Write-Host "P08_HEAD=$head"
          Write-Host "MAIN_HEAD=$main"
          Write-Host "MERGE_BASE=$mergeBase"
          Write-Host "MAIN...HEAD=$relationship"
          git status --short
          git log -1 --oneline

          if ($main -ne $authorizedMain) {
            throw "main drifted from authorized P0 source: $main"
          }
          if ($mergeBase -ne $authorizedMain) {
            throw "candidate no longer descends from authorized P0 source: merge-base=$mergeBase"
          }

          git merge-base --is-ancestor $p07 HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "P08 candidate does not descend from the accepted P07 integration SHA $p07"
          }

          if ($head -ne $env:QA_EXPECTED_SHA) {
            throw "Checked-out head does not equal github.sha: head=$head expected=$env:QA_EXPECTED_SHA"
          }

      - name: Fast source-contract guard before dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force storage/app/qa | Out-Null

          $retiredFiles = @(
            'config/showcase.php',
            'app/Services/ShowcaseSession.php',
            'app/Http/Controllers/ShowcaseSessionController.php',
            'app/Providers/ShowcaseServiceProvider.php',
            'resources/js/components/showcase/WorkspaceSwitcher.tsx'
          )
          foreach ($file in $retiredFiles) {
            if (Test-Path $file) { throw "Retired Showcase runtime file is active again: $file" }
          }

          $activeRoots = @('app', 'resources/js', 'routes', 'bootstrap', 'config')
          $files = Get-ChildItem $activeRoots -Recurse -File -ErrorAction SilentlyContinue
          $forbidden = @(
            '/showcase/session',
            '/showcase/switch',
            '/messages/prototype/messages',
            'messages.prototype.',
            'usePrototypeMessaging'
          )

          $failures = @()
          foreach ($token in $forbidden) {
            $hits = @($files | Select-String -SimpleMatch $token)
            foreach ($hit in $hits) {
              $failures += "$($hit.Path):$($hit.LineNumber): $($hit.Line.Trim())"
            }
          }

          $residue = @($files | Select-String -Pattern 'Prototype|Showcase')
          $residue | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" } |
            Set-Content storage/app/qa/p08-active-legacy-terminology.txt

          if (-not (Test-Path 'app/Models/Message.php')) {
            throw 'Canonical Messaging model app/Models/Message.php is missing.'
          }
          if (-not (Test-Path 'resources/js/hooks/messaging/useMessaging.ts')) {
            throw 'Canonical Messaging hook resources/js/hooks/messaging/useMessaging.ts is missing.'
          }

          if ($failures.Count -gt 0) {
            $failures | Set-Content storage/app/qa/p08-forbidden-contract-residue.txt
            throw "Retired active contract residue remains:`n$($failures -join "`n")"
          }

      - name: Setup Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP toolchain
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql, fileinfo, zip
          tools: composer:v2

      - name: Verify runner and database safety
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          node --version
          npm --version
          php --version
          composer --version

          $pwsh = (Get-Command pwsh -ErrorAction Stop).Source
          Write-Host "pwsh: $pwsh"
          if ($pwsh -like '*WindowsApps*') {
            throw "pwsh resolved through the WindowsApps alias instead of the real executable: $pwsh"
          }
          pwsh --version

          if ([string]::IsNullOrWhiteSpace($env:DB_PASSWORD)) {
            throw 'P0_POSTGRES_PASSWORD repository secret is missing or empty.'
          }

          $psql = Get-Command psql -ErrorAction SilentlyContinue
          if (-not $psql) {
            throw 'psql is not on PATH.'
          }
          psql --version

          if ($env:DB_DATABASE -ne 'talibon_portal_test') {
            throw "Refusing destructive validation against unexpected database: $env:DB_DATABASE"
          }

      - name: Ensure disposable PostgreSQL database exists
        run: |
          $ErrorActionPreference = 'Stop'
          $exists = (& psql -h $env:DB_HOST -p $env:DB_PORT -U $env:DB_USERNAME -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'talibon_portal_test';").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not connect to local PostgreSQL.'
          }
          if ($exists -ne '1') {
            & psql -h $env:DB_HOST -p $env:DB_PORT -U $env:DB_USERNAME -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE talibon_portal_test;'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create disposable talibon_portal_test database.' }
          }
          & psql -h $env:DB_HOST -p $env:DB_PORT -U $env:DB_USERNAME -d talibon_portal_test -v ON_ERROR_STOP=1 -c 'SELECT current_database();'
          if ($LASTEXITCODE -ne 0) { throw 'Disposable test database connectivity check failed.' }

      - name: Restore locked dependencies once
        run: |
          $ErrorActionPreference = 'Stop'
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          if ($LASTEXITCODE -ne 0) { throw "composer install failed with exit code $LASTEXITCODE." }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE." }

      - name: Prepare Laravel test environment
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item .env.example .env -Force
          php artisan key:generate
          if ($LASTEXITCODE -ne 0) { throw 'php artisan key:generate failed.' }
          php artisan optimize:clear
          if ($LASTEXITCODE -ne 0) { throw 'php artisan optimize:clear failed.' }
          php artisan about
          if ($LASTEXITCODE -ne 0) { throw 'php artisan about failed.' }

      - name: TypeScript and production build
        run: |
          $ErrorActionPreference = 'Stop'
          npm run types:check
          if ($LASTEXITCODE -ne 0) { throw "TypeScript validation failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Production build failed with exit code $LASTEXITCODE." }

      - name: Fresh disposable database and seed
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DB_DATABASE -ne 'talibon_portal_test') {
            throw "Refusing migrate:fresh against unexpected database: $env:DB_DATABASE"
          }
          php artisan migrate:fresh --seed --force
          if ($LASTEXITCODE -ne 0) { throw "migrate:fresh --seed failed with exit code $LASTEXITCODE." }

      - name: Route authority evidence
        run: |
          $ErrorActionPreference = 'Stop'
          php artisan route:list -v | Tee-Object -FilePath storage/app/qa/p08-route-list.txt
          if ($LASTEXITCODE -ne 0) { throw 'php artisan route:list failed.' }

          $routes = Get-Content storage/app/qa/p08-route-list.txt -Raw
          if ($routes -notmatch '(?m)\bmessages/feed\b') { throw 'Canonical messages/feed route is missing.' }
          if ($routes -match '(?m)\b(showcase/session|showcase/switch|messages/prototype/messages)\b') {
            throw 'Retired route contract remains in the executable route table.'
          }

      - name: Full Feature suite once
        run: |
          $ErrorActionPreference = 'Stop'
          php artisan test --testsuite=Feature
          if ($LASTEXITCODE -ne 0) { throw "Feature suite failed with exit code $LASTEXITCODE." }

      - name: Restore deterministic browser fixture state
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DB_DATABASE -ne 'talibon_portal_test') {
            throw "Refusing browser-fixture migrate:fresh against unexpected database: $env:DB_DATABASE"
          }
          php artisan migrate:fresh --seed --force
          if ($LASTEXITCODE -ne 0) { throw "Browser fixture reset failed with exit code $LASTEXITCODE." }

      - name: Laravel cacheability
        run: |
          $ErrorActionPreference = 'Stop'
          php artisan route:cache
          if ($LASTEXITCODE -ne 0) { throw 'php artisan route:cache failed.' }
          php artisan view:cache
          if ($LASTEXITCODE -ne 0) { throw 'php artisan view:cache failed.' }
          php artisan config:cache
          if ($LASTEXITCODE -ne 0) { throw 'php artisan config:cache failed.' }
          php artisan optimize:clear
          if ($LASTEXITCODE -ne 0) { throw 'php artisan optimize:clear failed.' }

      - name: Ensure Chromium for browser validation
        run: |
          $ErrorActionPreference = 'Stop'
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright Chromium install failed with exit code $LASTEXITCODE." }

      - name: Runtime and browser acceptance in one owned lifecycle
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force storage/logs | Out-Null
          Remove-Item public/hot -ErrorAction SilentlyContinue
          Remove-Item storage/framework/vite.hot -ErrorAction SilentlyContinue

          $stdout = Join-Path $PWD 'storage/logs/p08-laravel.out.log'
          $stderr = Join-Path $PWD 'storage/logs/p08-laravel.err.log'
          Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue

          $existing = @(Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue)
          if ($existing.Count -gt 0) {
            $owners = ($existing | Select-Object -ExpandProperty OwningProcess -Unique) -join ', '
            throw "Port 8000 is already occupied. Refusing to kill an unowned process. Owning PID(s): $owners"
          }

          $php = (Get-Command php -ErrorAction Stop).Source
          $proc = $null
          $listenerPid = $null

          try {
            $proc = Start-Process `
              -FilePath $php `
              -ArgumentList @('artisan','serve','--host=127.0.0.1','--port=8000') `
              -WorkingDirectory $PWD `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

            Write-Host "Laravel launcher PID=$($proc.Id)"

            $ready = $false
            for ($i = 1; $i -le 60; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) {
                Get-Content $stdout -Tail 200 -ErrorAction SilentlyContinue
                Get-Content $stderr -Tail 200 -ErrorAction SilentlyContinue
                throw "Laravel runtime exited before readiness. PID=$($proc.Id) exit=$($proc.ExitCode)"
              }

              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8000/login' -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                if ($i -eq 60) { Write-Warning $_.Exception.Message }
              }
              Start-Sleep -Seconds 1
            }

            if (-not $ready) {
              Get-Content $stdout -Tail 200 -ErrorAction SilentlyContinue
              Get-Content $stderr -Tail 200 -ErrorAction SilentlyContinue
              throw 'Laravel runtime did not become ready on port 8000 within 60 seconds.'
            }

            $listener = @(Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1)
            if ($listener.Count -eq 0) {
              throw 'Readiness request succeeded but no owned listener was visible on 127.0.0.1:8000.'
            }
            $listenerPid = [int]$listener[0].OwningProcess
            Write-Host "Laravel listener PID=$listenerPid"

            foreach ($path in @('/', '/login')) {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8000$path" -MaximumRedirection 5 -TimeoutSec 15
              if ($response.StatusCode -ge 500) { throw "$path returned $($response.StatusCode)" }
              Write-Host "$path => $($response.StatusCode)"
            }

            Write-Host '=== REAL AUTH + MFA RUNTIME MATRIX ==='
            & node tests/Browser/h0-runtime-readiness.mjs
            if ($LASTEXITCODE -ne 0) { throw "H0 runtime audit failed with exit code $LASTEXITCODE." }

            if ($env:DB_DATABASE -ne 'talibon_portal_test') {
              throw "Refusing browser audit reset against unexpected database: $env:DB_DATABASE"
            }
            & $php artisan migrate:fresh --seed --force
            if ($LASTEXITCODE -ne 0) { throw 'Failed to restore browser fixture state between independent runtime audits.' }

            Write-Host '=== 1440 / 390 RESPONSIVE BASELINE ==='
            & node tests/Browser/p08-responsive-smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw "P08 responsive smoke failed with exit code $LASTEXITCODE." }

            Write-Host '=== REAL-AUTH TWO-USER MESSAGING ==='
            & node tests/Browser/mp0-messaging-closure.mjs
            if ($LASTEXITCODE -ne 0) { throw "Two-user Messaging audit failed with exit code $LASTEXITCODE." }
          }
          finally {
            if ($listenerPid) {
              & taskkill.exe /PID $listenerPid /T /F 2>$null | Out-Null
              $listenerKillExit = $LASTEXITCODE
              if ($listenerKillExit -ne 0) {
                Write-Warning "Listener cleanup taskkill exited with code $listenerKillExit for PID $listenerPid."
              }
              $global:LASTEXITCODE = 0
            }

            if ($proc) {
              try {
                $proc.Refresh()
                if (-not $proc.HasExited) {
                  & taskkill.exe /PID $proc.Id /T /F 2>$null | Out-Null
                  $launcherKillExit = $LASTEXITCODE
                  if ($launcherKillExit -ne 0) {
                    Write-Warning "Launcher cleanup taskkill exited with code $launcherKillExit for PID $($proc.Id)."
                  }
                  $global:LASTEXITCODE = 0
                }
              } catch {
                Write-Warning "Runtime cleanup warning: $($_.Exception.Message)"
                $global:LASTEXITCODE = 0
              }
            }

            Start-Sleep -Milliseconds 500
            $remaining = @(Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue)
            if ($remaining.Count -gt 0) {
              $owners = ($remaining | Select-Object -ExpandProperty OwningProcess -Unique) -join ', '
              throw "Port 8000 still has listener PID(s) after cleanup: $owners"
            }

            $global:LASTEXITCODE = 0
          }

      - name: Repository hygiene and exact-tree evidence
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          Write-Host '=== WORKTREE ==='
          git status --short
          Write-Host '=== EXACT HEAD ==='
          git rev-parse HEAD
          Write-Host '=== SOURCE RELATIONSHIP ==='
          git rev-list --left-right --count origin/main...HEAD

      - name: Runtime diagnostics
        if: always()
        run: |
          Write-Host '=== EXACT HEAD ==='
          git rev-parse HEAD
          Write-Host '=== WORKTREE ==='
          git status --short
          Write-Host '=== PORT 8000 ==='
          Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host '=== LARAVEL STDOUT ==='
          Get-Content storage/logs/p08-laravel.out.log -Tail 200 -ErrorAction SilentlyContinue
          Write-Host '=== LARAVEL STDERR ==='
          Get-Content storage/logs/p08-laravel.err.log -Tail 200 -ErrorAction SilentlyContinue
          Write-Host '=== QA FILES ==='
          Get-ChildItem storage/app/qa -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Upload P08 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p08-baseline-acceptance-${{ github.sha }}
          path: |
            storage/app/qa/
            storage/logs/p08-laravel.out.log
            storage/logs/p08-laravel.err.log
          if-no-files-found: ignore
          retention-days: 14
