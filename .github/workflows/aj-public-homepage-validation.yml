name: AJ Public Homepage Validation

on:
  push:
    branches:
      - AJ-TALIBON-PUBLIC-HOMEPAGE-GREEN-REFINEMENT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aj-public-homepage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, runtime and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SHOWCASE_MODE: true
      PROTOTYPE_DEMO_PASSWORD: AJ-Public-Homepage-Disposable-Password-2026
      QA_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Record authority
        run: |
          echo "AJ_PUBLIC_HOMEPAGE_HEAD=$(git rev-parse HEAD)"
          git status --short
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql
          tools: composer:v2

      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare disposable Laravel runtime
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php artisan migrate:fresh --seed --force

      - name: TypeScript
        run: npm run types:check

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Laravel with compiled assets
        run: |
          rm -f public/hot storage/framework/vite.hot
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/aj-public-homepage.log 2>&1 &
          echo $! > /tmp/aj-public-homepage.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/aj-public-homepage.log
          exit 1

      - name: Responsive public homepage audit
        run: node tests/Browser/aj-public-homepage-visual.mjs

      - name: Runtime diagnostics
        if: always()
        run: |
          echo "=== EXACT HEAD ==="
          git rev-parse HEAD
          echo "=== LARAVEL LOG TAIL ==="
          tail -n 200 storage/logs/aj-public-homepage.log || true
          echo "=== PUBLIC HOMEPAGE EVIDENCE ==="
          find storage/app/qa/public-homepage -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload public homepage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aj-public-homepage-evidence-${{ github.sha }}
          path: |
            storage/app/qa/public-homepage/
            storage/logs/aj-public-homepage.log
          if-no-files-found: ignore
          retention-days: 14
