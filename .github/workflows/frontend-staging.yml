name: Frontend — Node install, TypeScript and Vite build

on:
  push:
    branches:
      - main
      - KIRCH-TALIBON-FRONTEND-REG-001-EXISTING-UI-STAGING-R1
  pull_request:
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'tests/Browser/cc-r1-real-runtime.mjs'
      - 'docs/qa/CC-R1-*'
      - '.github/workflows/frontend-staging.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run types:check
      - run: node --check tests/Browser/cc-r1-real-runtime.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run visual:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-visual-fixtures-${{ github.run_id }}
          path: artifacts/visual-fixture/
          if-no-files-found: warn
