name: Frontend staging — Node build and TypeScript

on:
  push:
    branches:
      - KIRCH-TALIBON-FRONTEND-REG-001-EXISTING-UI-STAGING-R1
  pull_request:
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend-staging.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run types:check
      - run: npm run build
