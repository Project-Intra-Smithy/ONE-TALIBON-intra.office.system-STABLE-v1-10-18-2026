name: A01-C1 Exact Candidate JSON Contract Validation

on:
  push:
    branches:
      - KIRCH-TALIBON-A01-C1-CI-VALIDATION-KURT

permissions:
  contents: read

concurrency:
  group: a01-c1-kurt-contract-exact-source
  cancel-in-progress: false

jobs:
  c1-validation:
    name: C1 JSON + W03 HTTP + Race + W02 + W01 + Work Request
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: c1-test-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: c1-test-only-ephemeral
      PGPASSWORD: c1-test-only-ephemeral
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
    steps:
      - name: Checkout exact C1 product source (not CI harness)
        uses: actions/checkout@v4
        with:
          ref: e72abfd1340451c4f857fd3534e28cb518e868bd
          fetch-depth: 0
          persist-credentials: false

      - name: Verify C1 source SHA and exact 7-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/KIRCH-TALIBON-A01-C1-CI-VALIDATION-KURT"
          test "$GITHUB_SHA" != "e72abfd1340451c4f857fd3534e28cb518e868bd"
          test "$(git rev-parse HEAD)" = "e72abfd1340451c4f857fd3534e28cb518e868bd"
          # actions/checkout fetched all refs; credentials deliberately remain disabled.
          git show-ref --verify --quiet refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "e49e9b2dafc4cac8869b5099270429d9abf8730e"
          test "$(git merge-base HEAD origin/main)" = "e49e9b2dafc4cac8869b5099270429d9abf8730e"
          test -z "$(git status --porcelain)"
          expected=$(cat <<'END_EXPECTED'
          .forge/contracts/A01-C1-INDIVIDUAL-TASK-HTTP-CONTRACT.md
          app/Http/Middleware/EnsureTaskJsonAccept.php
          app/Http/Middleware/RequireActiveAccount.php
          app/Http/Middleware/RequireMfaAssurance.php
          bootstrap/app.php
          tests/Feature/Tasks/IndividualTaskHttpTest.php
          tests/Feature/Tasks/TaskJsonContractBoundaryTest.php
          END_EXPECTED
          )
          actual="$(git diff --name-only "e49e9b2dafc4cac8869b5099270429d9abf8730e" HEAD)"
          test "$actual" = "$expected" || { echo "::error::C1 source diff scope drift"; diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true; exit 1; }
          mkdir -p storage/app/qa/a01-c1-exact
          {
            echo "KURT_CI_HARNESS_SHA=$GITHUB_SHA"
            echo "C1_PRODUCT_CHECKOUT_SHA=$(git rev-parse HEAD)"
            echo "MAIN_BASE_SHA=e49e9b2dafc4cac8869b5099270429d9abf8730e"
            echo "REPO=$GITHUB_REPOSITORY"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "RUNNER=$RUNNER_NAME"
            echo "APP_ENV=$APP_ENV"
            echo "DB_CONNECTION=$DB_CONNECTION"
            echo "DB_DATABASE=$DB_DATABASE"
            echo "DIFF_FILE_COUNT=7"
          } | tee storage/app/qa/a01-c1-exact/manifest.txt

      - name: Set up PHP 8.4 / PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql, fileinfo, zip
          tools: composer:v2

      - name: Confirm isolated empty PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "pgsql"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_PORT" = "5432"
          test "$DB_DATABASE" = "talibon_portal_test"
          test "$DB_USERNAME" = "postgres"
          test "$GITHUB_REPOSITORY" = "Project-Intra-Smithy/Talibon-Sales-Prototype"
          identity="$(psql -X -A -t -v ON_ERROR_STOP=1 -h "$DB_HOST" -U postgres -d "$DB_DATABASE" -c 'SELECT current_database() || chr(124) || current_user')"
          test "$identity" = "talibon_portal_test|postgres"
          tables="$(psql -X -A -t -v ON_ERROR_STOP=1 -h "$DB_HOST" -U postgres -d "$DB_DATABASE" -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          test "$tables" = "0" || { echo "::error::Nonempty PostgreSQL service; abort"; exit 1; }
          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "8.4"
          echo "EPHEMERAL_PG_DB_IDENTITY=$identity" >> storage/app/qa/a01-c1-exact/manifest.txt
          echo "EPHEMERAL_PG_INITIAL_TABLES=0" >> storage/app/qa/a01-c1-exact/manifest.txt

      - name: Install and migrate disposable CI database only
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          php artisan key:generate --force
          php artisan optimize:clear
          php artisan migrate --force
          php artisan migrate:status > storage/app/qa/a01-c1-exact/migrations.txt
          echo "MIGRATE_EXIT=0" >> storage/app/qa/a01-c1-exact/manifest.txt

      - name: Run C1 JSON boundary, W03 HTTP, PostgreSQL race, W02, W01 and Work Request suites
        shell: bash
        run: |
          # GitHub invokes bash with -e; unset it so every suite runs and is reported.
          set +e
          set -uo pipefail
          dir=storage/app/qa/a01-c1-exact
          php artisan test tests/Feature/Tasks/TaskJsonContractBoundaryTest.php --log-junit="$dir/c1-junit.xml" 2>&1 | tee "$dir/c1.log"
          c1=${PIPESTATUS[0]}
          php artisan test tests/Feature/Tasks/IndividualTaskHttpTest.php --log-junit="$dir/w03-junit.xml" 2>&1 | tee "$dir/w03.log"
          a=${PIPESTATUS[0]}
          php artisan test tests/Feature/Tasks/TaskConcurrentConnectionTest.php --log-junit="$dir/race-junit.xml" 2>&1 | tee "$dir/race.log"
          b=${PIPESTATUS[0]}
          php artisan test tests/Feature/Tasks/TaskCoreServiceTest.php --log-junit="$dir/w02-junit.xml" 2>&1 | tee "$dir/w02.log"
          c=${PIPESTATUS[0]}
          php artisan test tests/Feature/Tasks/TaskDomainFoundationTest.php --log-junit="$dir/w01-junit.xml" 2>&1 | tee "$dir/w01.log"
          d=${PIPESTATUS[0]}
          php artisan test tests/Feature/WorkRequestBackendValidationTest.php tests/Feature/WorkRequestPresentationTest.php --log-junit="$dir/work-request-junit.xml" 2>&1 | tee "$dir/work-request.log"
          e=${PIPESTATUS[0]}
          {
            echo "C1_JSON_BOUNDARY_EXIT=$c1"
            echo "W03_SUITE_EXIT=$a"
            echo "PGSQL_CONCURRENCY_EXIT=$b"
            echo "W02_SUITE_EXIT=$c"
            echo "W01_SUITE_EXIT=$d"
            echo "WORK_REQUEST_SUITE_EXIT=$e"
          } | tee -a "$dir/manifest.txt"
          if [ "$c1" -ne 0 ] || [ "$a" -ne 0 ] || [ "$b" -ne 0 ] || [ "$c" -ne 0 ] || [ "$d" -ne 0 ] || [ "$e" -ne 0 ]; then
            echo "VALIDATION_RESULT=FAIL" >> "$dir/manifest.txt"
            exit 1
          fi
          echo "VALIDATION_RESULT=PASS" >> "$dir/manifest.txt"

      - name: Verify real HTTP CSRF in non-testing Laravel runtime
        shell: bash
        run: |
          set -euo pipefail
          dir=storage/app/qa/a01-c1-exact
          test "$APP_ENV" = "testing"
          test "$DB_DATABASE" = "talibon_portal_test"
          test "$(git rev-parse HEAD)" = "e72abfd1340451c4f857fd3534e28cb518e868bd"
          # This probes real Laravel web/CSRF middleware under APP_ENV=local,
          # unlike feature tests whose APP_ENV=testing bypasses CSRF checks.
          APP_ENV=local APP_DEBUG=false SESSION_DRIVER=file php artisan serve --host=127.0.0.1 --port=8765 > "$dir/csrf-server.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 70); do
            status=$(curl --max-time 3 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/tasks || true)
            if [ "$status" = "401" ]; then break; fi
            sleep 1
          done
          get_code=$(curl --fail-with-body --max-time 10 -sS -D "$dir/http-guest-headers.txt" -o "$dir/http-guest-body.json" -w '%{http_code}' http://127.0.0.1:8765/tasks || true)
          test "$get_code" = "401" || { echo "::error::Unauthenticated JSON GET expected 401, got $get_code"; exit 1; }
          grep -qi '^content-type: application/json' "$dir/http-guest-headers.txt"
          csrf_code=$(curl --max-time 10 -sS -D "$dir/http-csrf-headers.txt" -o "$dir/http-csrf-body.json" -w '%{http_code}' -X POST http://127.0.0.1:8765/tasks -H 'Content-Type: application/json' -d '{"title":"Reject without CSRF"}')
          test "$csrf_code" = "419" || { echo "::error::Unprotected POST or HTML redirect; expected 419 got $csrf_code"; exit 1; }
          grep -qi '^content-type: application/json' "$dir/http-csrf-headers.txt"
          echo "NONTESTING_LARAVEL_ENV=local" >> "$dir/manifest.txt"
          echo "HTTP_GUEST_GET_CODE=$get_code" >> "$dir/manifest.txt"
          echo "HTTP_CSRF_NO_TOKEN_POST_CODE=$csrf_code" >> "$dir/manifest.txt"
          echo "HTTP_JSON_HEADER_CHECK=PASS" >> "$dir/manifest.txt"
          echo "REAL_CSRF_SMOKE=PASS" >> "$dir/manifest.txt"

      - name: Upload validation evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-c1-exact-contract-kurt-evidence
          path: storage/app/qa/a01-c1-exact/
          if-no-files-found: warn
          retention-days: 14
