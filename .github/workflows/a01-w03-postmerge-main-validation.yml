name: A01-W03 Exact Integrated-Main Post-Merge Validation

on:
  push:
    branches:
      - KIRCH-TALIBON-A01-W03-POSTMERGE-CI-KURT

permissions:
  contents: read

concurrency:
  group: a01-w03-kurt-http-postmerge-main
  cancel-in-progress: false

jobs:
  w03-validation:
    name: W03 HTTP + W02 + W01 + Work Request
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: w03-test-only-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: w03-test-only-ephemeral
      PGPASSWORD: w03-test-only-ephemeral
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
    steps:
      - name: Checkout integrated W03 main commit (not CI harness)
        uses: actions/checkout@v4
        with:
          ref: 0573680696c8bd6fb421d625b5e7dc2c37cb1905
          fetch-depth: 0
          persist-credentials: false

      - name: Verify W03 integrated-main SHA and exact 4-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/KIRCH-TALIBON-A01-W03-POSTMERGE-CI-KURT"
          test "$GITHUB_SHA" != "0573680696c8bd6fb421d625b5e7dc2c37cb1905"
          test "$(git rev-parse HEAD)" = "0573680696c8bd6fb421d625b5e7dc2c37cb1905"
          # actions/checkout fetched all refs; credentials deliberately remain disabled.
          git show-ref --verify --quiet refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "0573680696c8bd6fb421d625b5e7dc2c37cb1905"
          test "$(git merge-base HEAD origin/main)" = "0573680696c8bd6fb421d625b5e7dc2c37cb1905"
          # Verify exact PR #31 ancestry and byte-identical accepted source.
          test "$(git rev-parse HEAD^1)" = "1c8ce47546ebb2f964c37741781c10d901b8e618"
          test "$(git rev-parse HEAD^2)" = "f38c1f5f76d837e21a5e750e329d82c323ceb7e4"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'f38c1f5f76d837e21a5e750e329d82c323ceb7e4^{tree}')"

          test -z "$(git status --porcelain)"
          expected=$(cat <<'END_EXPECTED'
          app/Http/Controllers/Tasks/IndividualTaskController.php
          routes/web.php
          tests/Feature/Tasks/IndividualTaskHttpTest.php
          tests/Feature/Tasks/TaskConcurrentConnectionTest.php
          END_EXPECTED
          )
          actual="$(git diff --name-only "1c8ce47546ebb2f964c37741781c10d901b8e618" HEAD)"
          test "$actual" = "$expected" || { echo "::error::W03 source diff scope drift"; diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true; exit 1; }
          mkdir -p storage/app/qa/a01-w03-postmerge
          {
            echo "KURT_CI_HARNESS_SHA=$GITHUB_SHA"
            echo "W03_INTEGRATED_MAIN_SHA=$(git rev-parse HEAD)"
            echo "MAIN_BASE_SHA=1c8ce47546ebb2f964c37741781c10d901b8e618"
            echo "PR31_ACCEPTED_HEAD_SHA=f38c1f5f76d837e21a5e750e329d82c323ceb7e4"
            echo "PR31_MERGE_PARENT1_SHA=1c8ce47546ebb2f964c37741781c10d901b8e618"
            echo "PR31_MERGE_PARENT2_SHA=f38c1f5f76d837e21a5e750e329d82c323ceb7e4"
            echo "REPO=$GITHUB_REPOSITORY"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "RUNNER=$RUNNER_NAME"
            echo "APP_ENV=$APP_ENV"
            echo "DB_CONNECTION=$DB_CONNECTION"
            echo "DB_DATABASE=$DB_DATABASE"
            echo "DIFF_FILE_COUNT=4"
          } | tee storage/app/qa/a01-w03-postmerge/manifest.txt

      - name: Set up PHP 8.4 / PostgreSQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql, fileinfo, zip
          tools: composer:v2

      - name: Confirm isolated empty PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "pgsql"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_PORT" = "5432"
          test "$DB_DATABASE" = "talibon_portal_test"
          test "$DB_USERNAME" = "postgres"
          test "$GITHUB_REPOSITORY" = "Project-Intra-Smithy/Talibon-Sales-Prototype"
          identity="$(psql -X -A -t -v ON_ERROR_STOP=1 -h "$DB_HOST" -U postgres -d "$DB_DATABASE" -c 'SELECT current_database() || chr(124) || current_user')"
          test "$identity" = "talibon_portal_test|postgres"
          tables="$(psql -X -A -t -v ON_ERROR_STOP=1 -h "$DB_HOST" -U postgres -d "$DB_DATABASE" -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")"
          test "$tables" = "0" || { echo "::error::Nonempty PostgreSQL service; abort"; exit 1; }
          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "8.4"
          echo "EPHEMERAL_PG_DB_IDENTITY=$identity" >> storage/app/qa/a01-w03-postmerge/manifest.txt
          echo "EPHEMERAL_PG_INITIAL_TABLES=0" >> storage/app/qa/a01-w03-postmerge/manifest.txt

      - name: Install and migrate disposable CI database only
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          php artisan key:generate --force
          php artisan optimize:clear
          php artisan migrate --force
          php artisan migrate:status > storage/app/qa/a01-w03-postmerge/migrations.txt
          echo "MIGRATE_EXIT=0" >> storage/app/qa/a01-w03-postmerge/manifest.txt

      - name: Run W03 HTTP, actual PostgreSQL race, W02, W01 and Work Request suites
        shell: bash
        run: |
          # GitHub invokes bash with -e; unset it so every suite runs and is reported.
          set +e
          set -uo pipefail
          dir=storage/app/qa/a01-w03-postmerge
          php artisan test tests/Feature/Tasks/IndividualTaskHttpTest.php --log-junit="$dir/w03-junit.xml" 2>&1 | tee "$dir/w03.log"
          a=${PIPESTATUS[0]}
          php artisan test tests/Feature/Tasks/TaskConcurrentConnectionTest.php --log-junit="$dir/race-junit.xml" 2>&1 | tee "$dir/race.log"
          b=${PIPESTATUS[0]}
          php artisan test tests/Feature/Tasks/TaskCoreServiceTest.php --log-junit="$dir/w02-junit.xml" 2>&1 | tee "$dir/w02.log"
          c=${PIPESTATUS[0]}
          php artisan test tests/Feature/Tasks/TaskDomainFoundationTest.php --log-junit="$dir/w01-junit.xml" 2>&1 | tee "$dir/w01.log"
          d=${PIPESTATUS[0]}
          php artisan test tests/Feature/WorkRequestBackendValidationTest.php tests/Feature/WorkRequestPresentationTest.php --log-junit="$dir/work-request-junit.xml" 2>&1 | tee "$dir/work-request.log"
          e=${PIPESTATUS[0]}
          {
            echo "W03_SUITE_EXIT=$a"
            echo "PGSQL_CONCURRENCY_EXIT=$b"
            echo "W02_SUITE_EXIT=$c"
            echo "W01_SUITE_EXIT=$d"
            echo "WORK_REQUEST_SUITE_EXIT=$e"
          } | tee -a "$dir/manifest.txt"
          if [ "$a" -ne 0 ] || [ "$b" -ne 0 ] || [ "$c" -ne 0 ] || [ "$d" -ne 0 ] || [ "$e" -ne 0 ]; then
            echo "VALIDATION_RESULT=FAIL" >> "$dir/manifest.txt"
            exit 1
          fi
          echo "VALIDATION_RESULT=PASS" >> "$dir/manifest.txt"

      - name: Upload validation evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-w03-postmerge-exact-main-kurt-evidence
          path: storage/app/qa/a01-w03-postmerge/
          if-no-files-found: warn
          retention-days: 14
