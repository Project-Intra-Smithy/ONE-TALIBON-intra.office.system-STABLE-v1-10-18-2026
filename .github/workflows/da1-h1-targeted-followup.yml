name: DA1 H1 Targeted Follow-up

on:
  push:
    branches:
      - KIRCH-TALIBON-DA1-H1-CARRIER-NAVIGATION-REPAIR
    paths:
      - .github/workflows/da1-h1-targeted-followup.yml

permissions:
  contents: read

concurrency:
  group: da1-h1-targeted-followup-${{ github.sha }}
  cancel-in-progress: false

jobs:
  targeted-h1:
    name: Two transaction roots then correspondence dependents
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_h1_mutations
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_h1_mutations"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talibon_h1_mutations
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SHOWCASE_MODE: true
      PROTOTYPE_DEMO_PASSWORD: DA1-Disposable-Runner-Password-2026
      QA_BASE_URL: http://127.0.0.1:8000
      QA_ENVIRONMENT: github-isolated-da1-h1-targeted

    steps:
      - name: Checkout exact targeted SHA
        uses: actions/checkout@v4

      - name: Exact-head gate
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql
          tools: composer:v2

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php artisan migrate:fresh --seed --force
          npm run build

      - name: Node carrier syntax
        run: node --check tests/Browser/h1-mutation-readiness.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated H1 runtime
        run: |
          rm -f public/hot storage/framework/vite.hot
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/da1-h1-targeted-followup.log 2>&1 &
          echo $! > /tmp/da1-h1-targeted.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/da1-h1-targeted-followup.log
          exit 1

      - name: Rerun only transaction follow-up scenarios
        env:
          QA_EXPECTED_SHA: ${{ github.sha }}
          QA_H1_SCENARIOS: transactions-return-origin,transactions-request-information
        run: |
          node tests/Browser/h1-mutation-readiness.mjs
          cp storage/app/qa/h1-mutation-readiness-report.json storage/app/qa/h1-targeted-transaction-followup.json

      - name: Run correspondence dependents only after transaction follow-up passes
        env:
          QA_EXPECTED_SHA: ${{ github.sha }}
          QA_H1_SCENARIOS: correspondence-route-double-click,correspondence-begin-action
        run: |
          node tests/Browser/h1-mutation-readiness.mjs
          cp storage/app/qa/h1-mutation-readiness-report.json storage/app/qa/h1-targeted-correspondence-dependents.json

      - name: Diagnostics
        if: always()
        run: |
          echo "=== EXACT HEAD ==="
          git rev-parse HEAD
          echo "=== WORKTREE ==="
          git status --short
          echo "=== SERVER LOG TAIL ==="
          tail -n 200 storage/logs/da1-h1-targeted-followup.log || true
          echo "=== QA OUTPUTS ==="
          find storage/app/qa -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: da1-h1-targeted-followup-${{ github.sha }}
          path: |
            storage/app/qa/
            storage/logs/da1-h1-targeted-followup.log
          if-no-files-found: ignore
          retention-days: 14
