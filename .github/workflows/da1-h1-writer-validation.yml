name: DA1 H1 Writer Validation

on:
  push:
    branches:
      - KIRCH-TALIBON-DA1-H1-CARRIER-NAVIGATION-REPAIR
    paths:
      - .github/workflows/da1-h1-writer-validation.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: da1-h1-writer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  targeted-and-h1:
    name: Targeted repair proofs then one full H1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SHOWCASE_MODE: true
      PROTOTYPE_DEMO_PASSWORD: DA1-Disposable-Runner-Password-2026
      QA_DEMO_PASSWORD: DA1-Disposable-Runner-Password-2026
      QA_BASE_URL: http://127.0.0.1:8000
      QA_MODE: production
      QA_ENVIRONMENT: github-isolated-da1-h1

    steps:
      - name: Checkout exact writer SHA
        uses: actions/checkout@v4

      - name: Record exact authority
        run: |
          echo "DA1_H1_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql
          tools: composer:v2

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear

      - name: Carrier syntax gates
        run: |
          node --check tests/Browser/h1-mutation-readiness.mjs
          php -l tests/Browser/h1-mutation-probe.php

      - name: Prepare targeted Feature database
        run: php artisan migrate:fresh --seed --force

      - name: Targeted Feature proofs
        run: |
          php artisan test             tests/Feature/WorkQueueTest.php             tests/Feature/RepresentativeRoleExperienceTest.php             tests/Feature/DashboardWorkspaceTest.php             tests/Feature/CorrespondenceDetailWorkspaceTest.php             tests/Feature/CorrespondenceWorkspaceActionsTest.php             tests/Feature/W03ContextContinuityTest.php

      - name: Targeted frontend gates
        run: |
          npm run types:check
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated H1 database
        run: |
          php -r '$pdo=new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres","postgres",""); $pdo->exec("DROP DATABASE IF EXISTS talibon_h1_mutations"); $pdo->exec("CREATE DATABASE talibon_h1_mutations");'
          DB_DATABASE=talibon_h1_mutations php artisan migrate:fresh --seed --force

      - name: Start isolated H1 runtime
        run: |
          rm -f public/hot storage/framework/vite.hot
          DB_DATABASE=talibon_h1_mutations php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/da1-h1-laravel.log 2>&1 &
          echo $! > /tmp/da1-h1-laravel.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/da1-h1-laravel.log
          exit 1

      - name: Targeted H1 root scenarios
        env:
          QA_EXPECTED_SHA: ${{ github.sha }}
          QA_H1_SCENARIOS: transactions-return-origin,transactions-request-information,correspondence-register,correspondence-classify,memorandum-publish,travel-order-record-approved
          DB_DATABASE: talibon_h1_mutations
        run: |
          node tests/Browser/h1-mutation-readiness.mjs
          cp storage/app/qa/h1-mutation-readiness-report.json storage/app/qa/h1-targeted-roots-report.json

      - name: Targeted correspondence dependent scenarios
        env:
          QA_EXPECTED_SHA: ${{ github.sha }}
          QA_H1_SCENARIOS: correspondence-route-double-click,correspondence-begin-action
          DB_DATABASE: talibon_h1_mutations
        run: |
          node tests/Browser/h1-mutation-readiness.mjs
          cp storage/app/qa/h1-mutation-readiness-report.json storage/app/qa/h1-correspondence-dependents-report.json

      - name: Reset isolated H1 state before the one full run
        run: |
          kill "$(cat /tmp/da1-h1-laravel.pid)" || true
          DB_DATABASE=talibon_h1_mutations php artisan migrate:fresh --seed --force
          rm -f public/hot storage/framework/vite.hot
          DB_DATABASE=talibon_h1_mutations php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/da1-h1-full-laravel.log 2>&1 &
          echo $! > /tmp/da1-h1-full-laravel.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/da1-h1-full-laravel.log
          exit 1

      - name: Complete H1 exactly once
        env:
          QA_EXPECTED_SHA: ${{ github.sha }}
          DB_DATABASE: talibon_h1_mutations
        run: |
          unset QA_H1_SCENARIOS
          node tests/Browser/h1-mutation-readiness.mjs
          cp storage/app/qa/h1-mutation-readiness-report.json storage/app/qa/h1-full-report.json

      - name: Dispatch complete DA1 carrier exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run da1-prototype-day-audit.yml --ref "${GITHUB_REF_NAME}"

      - name: Runtime diagnostics
        if: always()
        run: |
          echo "=== EXACT HEAD ==="
          git rev-parse HEAD
          echo "=== WORKTREE ==="
          git status --short
          echo "=== H1 LOG TAIL ==="
          tail -n 200 storage/logs/da1-h1-full-laravel.log 2>/dev/null || tail -n 200 storage/logs/da1-h1-laravel.log 2>/dev/null || true
          echo "=== QA OUTPUTS ==="
          find storage/app/qa -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload H1 repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: da1-h1-writer-evidence-${{ github.sha }}
          path: |
            storage/app/qa/
            storage/logs/da1-h1-laravel.log
            storage/logs/da1-h1-full-laravel.log
          if-no-files-found: ignore
          retention-days: 14
