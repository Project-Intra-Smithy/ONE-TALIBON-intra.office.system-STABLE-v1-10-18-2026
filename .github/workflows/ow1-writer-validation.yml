name: OW1 Writer Validation

on:
  push:
    branches:
      - KIRCH-TALIBON-OW1-FIRST-RUN-ONBOARDING-TOUR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ow1-writer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OW1 exact-head validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SHOWCASE_MODE: true
      PROTOTYPE_DEMO_PASSWORD: OW1-Disposable-Runner-Password-2026
      QA_BASE_URL: http://127.0.0.1:8000
      QA_MODE: production

    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@v4

      - name: Record exact authority
        run: |
          echo "OW1_HEAD=$(git rev-parse HEAD)"
          git status --short
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql
          tools: composer:v2

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund

      - name: Prepare disposable Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear
          php artisan migrate:fresh --seed --force

      - name: TypeScript
        run: npm run types:check

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated production-asset runtime
        run: |
          rm -f public/hot storage/framework/vite.hot
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/ow1-laravel.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/ow1-laravel.log
          exit 1

      - name: OW1 onboarding browser proof
        run: node tests/Browser/ow1-onboarding-tour.mjs

      - name: Diagnostics
        if: always()
        run: |
          echo "=== EXACT HEAD ==="
          git rev-parse HEAD
          echo "=== WORKTREE ==="
          git status --short
          echo "=== LARAVEL LOG TAIL ==="
          tail -n 200 storage/logs/ow1-laravel.log || true
          echo "=== OW1 QA ==="
          cat storage/app/qa/ow1-onboarding-tour-report.json || true

      - name: Upload OW1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ow1-writer-evidence-${{ github.sha }}
          path: |
            storage/app/qa/ow1-onboarding-tour-report.json
            storage/logs/ow1-laravel.log
          if-no-files-found: ignore
          retention-days: 14
