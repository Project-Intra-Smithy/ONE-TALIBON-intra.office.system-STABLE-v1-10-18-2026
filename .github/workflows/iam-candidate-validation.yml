name: IAM Candidate PostgreSQL Validation

on:
  push:
    branches:
      - candidate/codex-iam-admin-provisioning-r2
      - candidate/unified-system-integration-r1
      - candidate/security-hardening-r1
      - candidate/operationforge-devtest-compatibility-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Playwright 1.55 Chromium dependencies require a supported runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: iam_candidate_disposable
      N03_DISPOSABLE_LEASE: ${{ (github.ref_name == 'candidate/unified-system-integration-r1' || github.ref_name == 'candidate/security-hardening-r1' || github.ref_name == 'candidate/operationforge-devtest-compatibility-r1') && 'EXCLUSIVE_PG16_SYNTHETIC_ONLY' || '' }}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: iam_candidate_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, fileinfo, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: npm ci
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          # Refuse any preexisting or non-disposable database; use forward-only migration.
          php -r '$p = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=talibon_portal_test", "postgres", "iam_candidate_disposable"); $db=$p->query("select current_database()")->fetchColumn(); $tables=(int)$p->query("select count(*) from pg_tables where schemaname = current_schema()")->fetchColumn(); if ($db !== "talibon_portal_test" || $tables !== 0) {fwrite(STDERR,"Refusing nonempty/incorrect database\n");exit(1);}'
          php artisan migrate --force --no-interaction
      - name: Disposable regression schema lifecycle bootstrap
        if: (github.ref_name == 'candidate/unified-system-integration-r1' || github.ref_name == 'candidate/security-hardening-r1' || github.ref_name == 'candidate/operationforge-devtest-compatibility-r1')
        env:
          N03_DISPOSABLE_LEASE: EXCLUSIVE_PG16_SYNTHETIC_ONLY
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/n03-regression-bootstrap.php" <<'PHP'
          <?php
          require getenv('GITHUB_WORKSPACE').'/vendor/autoload.php';
          if (getenv('GITHUB_ACTIONS') !== 'true' || getenv('APP_ENV') !== 'testing'
              || getenv('DB_DATABASE') !== 'talibon_portal_test'
              || getenv('N03_DISPOSABLE_LEASE') !== 'EXCLUSIVE_PG16_SYNTHETIC_ONLY'
              || getenv('N03_ROLE_SUITE') === '1') {
              throw new RuntimeException('Unsafe N03 regression bootstrap.');
          }
          \Illuminate\Database\Connection::resolverFor('pgsql', static function ($connection, $database, $prefix, $config) {
              return new class($connection, $database, $prefix, $config) extends \Illuminate\Database\PostgresConnection {
                  public function getSchemaBuilder()
                  {
                      if (is_null($this->schemaGrammar)) {
                          $this->useDefaultSchemaGrammar();
                      }
                      return new class($this) extends \Illuminate\Database\Schema\PostgresBuilder {
                          public function dropAllTables()
                          {
                              $db = $this->connection;
                              $db->transaction(function () use ($db) {
                                  $guard = $db->selectOne("SELECT current_database() AS db, current_setting('server_version_num')::integer AS version, current_setting('is_superuser') AS bootstrap, to_regnamespace('legacy_custody') IS NOT NULL AS present, EXISTS(SELECT 1 FROM pg_catalog.pg_roles WHERE rolname LIKE 'kirion_g1b_%' OR rolname LIKE 'n03_%') AS role_cluster");
                                  if ($guard->db !== 'talibon_portal_test' || $guard->version < 160000 || $guard->version >= 170000
                                      || $guard->bootstrap !== 'on' || $guard->role_cluster) {
                                      throw new RuntimeException('Refusing N03 regression wipe outside the normal isolated cluster.');
                                  }
                                  if ($guard->present) {
                                      $db->unprepared('DROP SCHEMA legacy_custody CASCADE');
                                  }
                                  parent::dropAllTables();
                              });
                          }
                      };
                  }
              };
          });
          PHP
          php -l "$RUNNER_TEMP/n03-regression-bootstrap.php"

      - name: Permanent IAM lifecycle
        run: |
          if { [ "$GITHUB_REF_NAME" = "candidate/unified-system-integration-r1" ] || [ "$GITHUB_REF_NAME" = "candidate/security-hardening-r1" ] || [ "$GITHUB_REF_NAME" = "candidate/operationforge-devtest-compatibility-r1" ]; }; then
            N03_DISPOSABLE_LEASE=EXCLUSIVE_PG16_SYNTHETIC_ONLY php artisan test --bootstrap="$RUNNER_TEMP/n03-regression-bootstrap.php" tests/Feature/PermanentIamLifecycleTest.php
          else
            php artisan test tests/Feature/PermanentIamLifecycleTest.php
          fi
      - name: Feature regression
        run: |
          if { [ "$GITHUB_REF_NAME" = "candidate/unified-system-integration-r1" ] || [ "$GITHUB_REF_NAME" = "candidate/security-hardening-r1" ] || [ "$GITHUB_REF_NAME" = "candidate/operationforge-devtest-compatibility-r1" ]; }; then
            N03_DISPOSABLE_LEASE=EXCLUSIVE_PG16_SYNTHETIC_ONLY php artisan test --bootstrap="$RUNNER_TEMP/n03-regression-bootstrap.php" --testsuite=Feature
          else
            php artisan test --testsuite=Feature
          fi
      - name: Frontend validation
        run: |
          npm run types:check
          npm run test:contracts
          npm run test:ux
          npm run build

      - name: Install Chromium for authenticated onboarding
        run: npx playwright install --with-deps chromium
      - name: Generate disposable synthetic credentials
        run: |
          for key in IAM_QA_ADMIN_PASSWORD IAM_QA_EMPLOYEE_PASSWORD IAM_QA_RECOVERY_PASSWORD; do
            value="$(openssl rand -hex 20)Aa1!"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create bounded browser fixture
        run: php tests/Browser/iam-pr48-fixture.php
      - name: Start isolated Laravel HTTP service
        run: |
          APP_ENV=local php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/iam-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/login; then exit 0; fi
            sleep 1
          done
          echo "Disposable IAM HTTP service failed to start" >&2
          exit 1
      - name: Chromium administrator-to-employee lifecycle (1440 and 390px)
        env:
          QA_EXPECTED_SHA: ${{ github.sha }}
        run: node tests/Browser/iam-pr48-onboarding.mjs
      - name: Upload sanitized browser QA receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iam-pr48-synthetic-browser-receipt
          path: storage/app/qa/iam-pr48-browser.json
          if-no-files-found: ignore
          retention-days: 7
