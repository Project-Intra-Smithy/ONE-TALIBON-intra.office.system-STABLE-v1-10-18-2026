name: IAM Candidate PostgreSQL Validation

on:
  push:
    branches:
      - candidate/codex-iam-admin-provisioning-r2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: iam_candidate_disposable
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: iam_candidate_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, fileinfo, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: npm ci
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          # Refuse any preexisting or non-disposable database; use forward-only migration.
          php -r '$p = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=talibon_portal_test", "postgres", "iam_candidate_disposable"); $db=$p->query("select current_database()")->fetchColumn(); $tables=(int)$p->query("select count(*) from pg_tables where schemaname = current_schema()")->fetchColumn(); if ($db !== "talibon_portal_test" || $tables !== 0) {fwrite(STDERR,"Refusing nonempty/incorrect database\n");exit(1);}'
          php artisan migrate --force --no-interaction
      - name: Permanent IAM lifecycle
        run: php artisan test tests/Feature/PermanentIamLifecycleTest.php
      - name: Feature regression
        run: php artisan test --testsuite=Feature
      - name: Frontend validation
        run: |
          npm run types:check
          npm run test:contracts
          npm run test:ux
          npm run build

      - name: Install Chromium for authenticated onboarding
        run: npx playwright install --with-deps chromium
      - name: Generate disposable synthetic credentials
        run: |
          for key in IAM_QA_ADMIN_PASSWORD IAM_QA_EMPLOYEE_PASSWORD IAM_QA_RECOVERY_PASSWORD; do
            value="$(openssl rand -hex 20)Aa1!"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Create bounded browser fixture
        run: php tests/Browser/iam-pr48-fixture.php
      - name: Start isolated Laravel HTTP service
        run: |
          APP_ENV=local php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/iam-http.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/login; then exit 0; fi
            sleep 1
          done
          echo "Disposable IAM HTTP service failed to start" >&2
          exit 1
      - name: Chromium administrator-to-employee lifecycle (1440 and 390px)
        env:
          QA_EXPECTED_SHA: \${{ github.sha }}
        run: node tests/Browser/iam-pr48-onboarding.mjs
      - name: Upload sanitized browser QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iam-pr48-synthetic-browser-receipt
          path: storage/app/qa/iam-pr48-browser.json
          if-no-files-found: ignore
          retention-days: 7
