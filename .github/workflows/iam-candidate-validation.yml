name: IAM Candidate PostgreSQL Validation

on:
  push:
    branches:
      - candidate/codex-iam-admin-provisioning-r2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: iam_candidate_disposable
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: iam_candidate_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, fileinfo, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: npm ci
      - name: Prepare isolated application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
      - name: Permanent IAM lifecycle
        run: php artisan test tests/Feature/PermanentIamLifecycleTest.php
      - name: Feature regression
        run: php artisan test --testsuite=Feature
      - name: Frontend validation
        run: |
          npm run types:check
          npm run test:contracts
          npm run test:ux
          npm run build
