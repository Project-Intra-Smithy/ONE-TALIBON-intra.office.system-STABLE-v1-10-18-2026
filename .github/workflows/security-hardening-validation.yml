name: Security Hardening Verification
on:
  push:
    branches:
      - candidate/security-hardening-r1
permissions:
  contents: read
jobs:
  security-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Exact lock advisory checks and redacted local history scan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          date -u
          sha256sum composer.lock package-lock.json
          composer --version
          npm --version
          status=0
          composer audit --locked --format=json > "$RUNNER_TEMP/composer-advisories.json" || status=1
          npm audit --json > "$RUNNER_TEMP/npm-advisories.json" || status=1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for name in ["composer", "npm"]:
              data = json.loads((root / (name + "-advisories.json")).read_text())
              if name == "composer":
                  advisories = data.get("advisories", {})
                  for package, entries in advisories.items() if isinstance(advisories, dict) else []:
                      for a in entries:
                          print(name, package, a.get("advisoryId"), a.get("cve"), a.get("affectedVersions"))
                  print(name, "abandoned count", len(data.get("abandoned", [])))
              else:
                  print(name, "summary", data.get("metadata", {}).get("vulnerabilities", {}))
                  for package, vulnerability in data.get("vulnerabilities", {}).items():
                      for via in vulnerability.get("via", []):
                          if isinstance(via, dict):
                              print(name, package, via.get("source"), via.get("severity"))
          PY
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          scan=0
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" . > "$RUNNER_TEMP/gitleaks-console.log" 2>&1 || scan=$?
          SCAN_STATUS="$scan" python3 - <<'PY'
          import json, os, collections
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gitleaks.json"
          reviewed = {
              ("generic-api-key", "7ecc4657c542833b55fcc5067eb813443f939f87", "tests/Feature/CorrespondenceLinkedTransactionParityTest.php", 320, 320): "synthetic event key",
              ("generic-api-key", "079c79893c5aa754e6a9929b26305fd0fbf31a45", "tests/Feature/CorrespondenceLinkedTransactionParityTest.php", 292, 292): "synthetic event key",
              ("generic-api-key", "2d39f7ba0f764769130a4e0066a0d0e5163b4eb0", ".forge/evidence/integration/OT-WHOLE-PRODUCT-INTEGRATION-MANIFEST-R1.md", 10, 10): "documented commit SHA",
              ("generic-api-key", "2d39f7ba0f764769130a4e0066a0d0e5163b4eb0", "tests/Feature/WorkRequests/WorkRequestRevocationTest.php", 216, 216): "fake storage content",
              ("generic-api-key", "eb0875822afe697a03c4d6781692133483710f51", "docs/evidence/fe-rc-draft/README.md", 26, 26): "documented commit SHA",
              ("generic-api-key", "8a4e201b1626428fd55b5e1c3716c228736337ed", "docs/evidence/fe-rc-draft/README.md", 26, 26): "documented commit SHA",
              ("generic-api-key", "2de01349c0c7a1c7ec906015762f97931587268a", "tests/Feature/WorkRequests/WorkRequestRevocationTest.php", 216, 216): "fake storage content",
              ("generic-api-key", "7cb66691192e6ec906cd9e0dc86c4de7332a1c51", "tests/Feature/WorkRequests/WorkRequestRevocationTest.php", 216, 216): "fake storage content",
              ("generic-api-key", "3628e6e84949f7a7a8afbff4a9bd21c072c241ef", "docs/contracts/ONE_TALIBON_FRONTEND_CONTRACT_PACK_R1/BACKEND_PRODUCER_VERIFICATION.md", 53, 53): "HTTP contract documentation",
              ("generic-api-key", "df5946b32adc641497ce160e9056509d6d0ba42b", "tests/Feature/MeetingCalendarProjectionTest.php", 37, 37): "synthetic event key",
              ("generic-api-key", "df5946b32adc641497ce160e9056509d6d0ba42b", "tests/Feature/MeetingCalendarProjectionTest.php", 56, 56): "synthetic event key",
          }
          if not p.is_file():
              raise SystemExit("Missing scanner report")
          rows = json.loads(p.read_text())
          if not isinstance(rows, list):
              raise SystemExit("Invalid scanner report")
          scan = int(os.environ["SCAN_STATUS"])
          if scan not in (0, 1) or (scan == 1) != bool(rows):
              raise SystemExit("Scanner execution error or inconsistent result")
          print("Redacted history finding count:", len(rows))
          print("Rule counts:", dict(collections.Counter(x.get("RuleID", "unknown") for x in rows)))
          seen = set()
          unknown = 0
          for x in rows:
              key = tuple(x[k] for k in ("RuleID", "Commit", "File", "StartLine", "EndLine"))
              disposition = reviewed.get(key)
              if key in seen or disposition is None:
                  unknown += 1
              seen.add(key)
              print("REDACTED_FINDING", json.dumps({"location": key, "disposition": disposition or "UNREVIEWED"}))
          print("Unreviewed or duplicate findings:", unknown)
          if unknown:
              raise SystemExit(1)
          PY
          rm -f "$RUNNER_TEMP/gitleaks.json" "$RUNNER_TEMP/gitleaks-console.log" "$RUNNER_TEMP/composer-advisories.json" "$RUNNER_TEMP/npm-advisories.json"
          test "$status" -eq 0
