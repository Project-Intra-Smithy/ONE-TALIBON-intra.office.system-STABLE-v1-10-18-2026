name: Security Hardening Verification
on:
  push:
    branches:
      - candidate/security-hardening-r1
permissions:
  contents: read
jobs:
  security-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Exact lock advisory checks and redacted local history scan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          date -u
          sha256sum composer.lock package-lock.json
          composer --version
          npm --version
          status=0
          composer audit --locked --format=json > "$RUNNER_TEMP/composer-advisories.json" || status=1
          npm audit --json > "$RUNNER_TEMP/npm-advisories.json" || status=1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          for name in ["composer", "npm"]:
              data = json.loads((root / (name + "-advisories.json")).read_text())
              if name == "composer":
                  advisories = data.get("advisories", {})
                  for package, entries in advisories.items() if isinstance(advisories, dict) else []:
                      for a in entries:
                          print(name, package, a.get("advisoryId"), a.get("cve"), a.get("affectedVersions"))
                  print(name, "abandoned count", len(data.get("abandoned", [])))
              else:
                  print(name, "summary", data.get("metadata", {}).get("vulnerabilities", {}))
                  for package, vulnerability in data.get("vulnerabilities", {}).items():
                      for via in vulnerability.get("via", []):
                          if isinstance(via, dict):
                              print(name, package, via.get("source"), via.get("severity"))
          PY
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          scan=0
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json" . > "$RUNNER_TEMP/gitleaks-console.log" 2>&1 || scan=$?
          SCAN_STATUS="$scan" python3 - <<'PY'
          import json, os, collections
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "gitleaks.json"
          if p.exists():
              rows = json.loads(p.read_text()) or []
              print("Redacted history finding count:", len(rows))
              print("Rule counts:", dict(collections.Counter(x.get("RuleID", "unknown") for x in rows)))
          else:
              print("No scan report emitted; scanner exit:", os.environ["SCAN_STATUS"])
          PY
          rm -f "$RUNNER_TEMP/gitleaks.json" "$RUNNER_TEMP/gitleaks-console.log" "$RUNNER_TEMP/composer-advisories.json" "$RUNNER_TEMP/npm-advisories.json"
          test "$scan" -eq 0 && test "$status" -eq 0
