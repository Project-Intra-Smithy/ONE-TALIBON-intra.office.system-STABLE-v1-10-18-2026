name: Forge UIUX Validation

on:
  push:
    branches:
      - KIRCH-TALIBON-V1-UIUX-CORRECTION
      - 'KIRCH-TALIBON-UIUX-W*'
      - candidate/codex-iam-admin-provisioning-r2
  pull_request:
    branches:
      - KIRCH-TALIBON-V1-UIUX-CORRECTION

permissions:
  contents: read

concurrency:
  group: forge-uiux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run types:check

      - name: Production build
        run: npm run build

  backend:
    name: Laravel feature tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: iam_candidate_disposable
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: iam_candidate_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Fail closed: this runner must use a newly provisioned empty test DB.
          php -r '$p = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=talibon_portal_test", "postgres", "iam_candidate_disposable"); if ($p->query("select current_database()")->fetchColumn() !== "talibon_portal_test" || (int)$p->query("select count(*) from pg_tables where schemaname = current_schema()")->fetchColumn() !== 0) {fwrite(STDERR,"Refusing nonempty/incorrect database\\n");exit(1);}'
          php artisan migrate --force --no-interaction

      - name: Run full Feature regression
        run: php artisan test --testsuite=Feature
