name: DA1 Prototype Day Audit

on:
  push:
    branches:
      - KIRCH-TALIBON-DA1-PROTOTYPE-DAY-BLOCKER-AUDIT

permissions:
  contents: read

concurrency:
  group: da1-prototype-day-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Exact-head prototype-day audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talibon_portal_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d talibon_portal_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: talibon_portal_test
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SHOWCASE_MODE: true
      PROTOTYPE_DEMO_PASSWORD: DA1-Disposable-Runner-Password-2026
      QA_BASE_URL: http://127.0.0.1:8000
      QA_MODE: production

    steps:
      - name: Checkout exact audit SHA
        uses: actions/checkout@v4

      - name: Record exact authority
        run: |
          echo "DA1_HEAD=$(git rev-parse HEAD)"
          git status --short
          git log -1 --oneline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql, pgsql
          tools: composer:v2

      - name: Install locked dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci --no-audit --no-fund

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan optimize:clear

      - name: Fresh disposable database and seed
        run: php artisan migrate:fresh --seed --force

      - name: Verify seven curated personas
        run: |
          php artisan tinker --execute="
          $emails = array_column(config('showcase.personas'), 'email');
          $count = AppModelsUser::query()->whereIn('email', $emails)->where('is_active', true)->count();
          if ($count !== 7) { throw new RuntimeException('Expected seven active showcase personas; got '.$count); }
          echo 'DA1_PERSONAS_PASS count='.$count.PHP_EOL;
          "

      - name: TypeScript
        run: npm run types:check

      - name: Production build
        run: npm run build

      - name: Laravel cacheability
        run: |
          php artisan route:cache
          php artisan view:cache
          php artisan config:cache
          php artisan optimize:clear

      - name: Full Feature suite
        run: php artisan test --testsuite=Feature

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Laravel production-asset runtime
        run: |
          rm -f public/hot storage/framework/vite.hot
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/da1-laravel.log 2>&1 &
          echo $! > /tmp/da1-laravel.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/da1-laravel.log
          exit 1

      - name: V1 showcase browser audit
        run: node tests/Browser/v1-showcase-readiness.mjs

      - name: Two-user Messages audit
        run: node tests/Browser/mp0-messaging-closure.mjs

      - name: Runtime diagnostics
        if: always()
        run: |
          echo "=== EXACT HEAD ==="
          git rev-parse HEAD
          echo "=== WORKTREE ==="
          git status --short
          echo "=== LARAVEL LOG TAIL ==="
          tail -n 200 storage/logs/da1-laravel.log || true
          echo "=== QA OUTPUTS ==="
          find storage/app/qa -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload DA1 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: da1-prototype-day-evidence-${{ github.sha }}
          path: |
            storage/app/qa/
            storage/logs/da1-laravel.log
          if-no-files-found: ignore
          retention-days: 14
